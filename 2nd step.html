<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Your Surprise ❤️</title>

<style>

    * {
        box-sizing: border-box;
    }

  body {
    margin: 0;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 15px;

    font-family: Arial, sans-serif;
    text-align: center;

    background: linear-gradient(135deg, #ff9a9e, #fad0c4);

    overflow: hidden;
}

.card {
    width: 100%;
    max-width: 400px;

    padding: clamp(20px, 6vw, 40px)
             clamp(15px, 6vw, 25px);

    border-radius: 30px;

    background: white;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    max-height: calc(100dvh - 30px);

    overflow-y: auto;
}
    @keyframes appear {
        from {
            opacity: 0;
            transform: scale(0.5);
        }

        to {
            opacity: 1;
            transform: scale(1);
        }
    }

   

    h2 {
        color: #a855f7;
    }

   h1 {
    color: #ff4f81;
    font-size: clamp(22px, 7vw, 30px);
    margin: 10px 0;
}

p {
    color: #555;
    font-size: clamp(14px, 4.5vw, 18px);
    line-height: 1.5;
    margin: 8px 0;
}

.gift {
    font-size: clamp(60px, 20vw, 100px);
    display: inline-block;
    cursor: pointer;
}

    button {
        margin-top: 20px;
        padding: 13px 25px;
        border: none;
        border-radius: 25px;
        background: #ff4f81;
        color: white;
        font-size: 17px;
        cursor: pointer;
    }

    button:hover {
        background: #e63e70;
        transform: scale(1.05);
    }

    #letter {
        display: none;
        animation: appear 1s ease;
    }

  .big-heart {
    font-size: clamp(60px, 20vw, 90px);
    animation: heartbeat 1s infinite;
    line-height: 1;
}

    @keyframes heartbeat {
        0%, 100% {
            transform: scale(1);
        }

        50% {
            transform: scale(1.2);
        }
    }

    /* Small mobile phones */
@media (max-height: 650px) {

    body {
        padding: 10px;
    }

    .card {
        padding: 18px 15px;
        border-radius: 25px;
    }

    .big-heart {
        font-size: 55px;
    }

    h1 {
        margin: 6px 0;
    }

    p {
        margin: 5px 0;
        font-size: 14px;
    }

    h2 {
        margin: 8px 0 0;
        font-size: 18px;
    }
}

</style>
</head>

<body>

<div class="card">

    <div class="gift">🎁✨</div>

    <h1>Surprise! 🎉</h1>

    <h2>Happy Birthday! 🎂</h2>

    <p>
        Today is your special day! ❤️
    </p>

    <p>
        You deserve all the happiness,
        love and beautiful moments in the world. ✨
    </p>

    <button onclick="openLetter()">
        💌 Open Your Letter
    </button>

   
    </div>

</div>

<script>

function openLetter() {


     window.location.href = "3rd step.html";

}

function createConfetti() {

    const emojis = ["😍","😘","🥰","💕"];

    for (let i = 0; i < 40; i++) {

        const confetti = document.createElement("div");

        confetti.innerHTML =
            emojis[Math.floor(Math.random() * emojis.length)];

        confetti.style.position = "fixed";
        confetti.style.left = Math.random() * 100 + "%";
        confetti.style.top = "-30px";
        confetti.style.fontSize = "25px";
        confetti.style.zIndex = "999";

        document.body.appendChild(confetti);

        const duration = Math.random() * 3 + 2;

        confetti.animate(
            [
                {
                    transform: "translateY(0) rotate(0deg)",
                    opacity: 1
                },
                {
                    transform:
                    `translateY(110vh) rotate(720deg)`,
                    opacity: 0
                }
            ],
            {
                duration: duration * 1000,
                easing: "linear"
            }
        );

        setTimeout(() => {
            confetti.remove();
        }, duration * 1000);
    }
}

   createConfetti();
    setInterval(createConfetti, 2000);
</script>

</body>
</html>
