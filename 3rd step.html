<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You 💞 </title>

    <style>

        * {
        box-sizing: border-box;
    }

   body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;
    text-align: center;

    background: linear-gradient(135deg, #ff9a9e, #fad0c4);

    overflow: hidden;
}

    .card {
    width: 90%;
    max-width: 400px;

    padding: clamp(20px, 5vw, 40px)
             clamp(15px, 5vw, 25px);

    border-radius: 30px;

    background: white;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    max-height: 90vh;
}

    @keyframes appear {
        from {
            opacity: 0;
            transform: scale(0.5);
        }

        to {
            opacity: 1;
            transform: scale(1);
        }
    }

  

    h2 {
        color: #a855f7;
    }

 h1 {
    color: #ff4f81;
    font-size: clamp(22px, 7vw, 30px);
    margin: 10px 0;
}

p {
    color: #555;
    font-size: clamp(14px, 4.5vw, 18px);
    margin: 10px 0;
}

.gift {
    font-size: clamp(60px, 20vw, 100px);
    display: inline-block;
    cursor: pointer;
}

    button {
        margin-top: 20px;
        padding: 13px 25px;
        border: none;
        border-radius: 25px;
        background: #ff4f81;
        color: white;
        font-size: 17px;
        cursor: pointer;
    }

    button:hover {
        background: #e63e70;
        transform: scale(1.05);
    }

    #letter {
        display: none;
        animation: appear 1s ease;
    }

    .big-heart {
        font-size: 90px;
        animation: heartbeat 1s infinite;
    }

    @keyframes heartbeat {
        0%, 100% {
            transform: scale(1);
        }

        50% {
            transform: scale(1.2);
        }
    }
    </style>
</head>
<body>
    
    <div class="card">
        <div class="big-heart">❤️</div>

        <h1>For You 💕</h1>

        <p>
            Happy Birthday to someone truly special! 🎂
        </p>

        <p>
            May your life always be filled with
            smiles, happiness, success and love. 🌸
        </p>

        <p>
            Keep smiling and keep shining! ✨
        </p>

        <h2>🎊 Have an Amazing Birthday! 🎊</h2>
    </div>

<script>
    
    function createConfetti() {

    const emojis = ["🎉", "🎊", "❤️", "✨", "💕", "🎂"];

    for (let i = 0; i < 40; i++) {

        const confetti = document.createElement("div");

        confetti.innerHTML =
            emojis[Math.floor(Math.random() * emojis.length)];

        confetti.style.position = "fixed";
        confetti.style.left = Math.random() * 100 + "%";
        confetti.style.top = "-30px";
        confetti.style.fontSize = "25px";
        confetti.style.zIndex = "999";

        document.body.appendChild(confetti);

        const duration = Math.random() * 3 + 2;

        confetti.animate(
            [
                {
                    transform: "translateY(0) rotate(0deg)",
                    opacity: 1
                },
                {
                    transform:
                    `translateY(110vh) rotate(720deg)`,
                    opacity: 0
                }
            ],
            {
                duration: duration * 1000,
                easing: "linear"
            }
        );

        setTimeout(() => {
            confetti.remove();
        }, duration * 1000);
    }
}

    createConfetti();
    setInterval(createConfetti, 700);

</script>

</body>
</html>
