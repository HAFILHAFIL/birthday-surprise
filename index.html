<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Surprise 🎂</title>

<style>
    * {
        box-sizing: border-box;
    }

body {
    margin: 0;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 15px;

    font-family: Arial, sans-serif;
    text-align: center;

    background: linear-gradient(135deg, #ff9a9e, #fad0c4);

    overflow: hidden;
}
  

  .card {
    width: 100%;
    max-width: 400px;

    padding: clamp(20px, 6vw, 40px)
             clamp(15px, 6vw, 25px);

    border-radius: 30px;

    background: white;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    max-height: calc(100dvh - 30px);

    overflow-y: auto;
}

   

    #popup {
    position: fixed;
    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    display: none;
    justify-content: center;
    align-items: center;

    background: rgba(255, 154, 158, 0.8);

    z-index: 1000;
}

.password-box {
    background: white;
    padding: 30px;
    width: 85%;
    max-width: 350px;

    border-radius: 25px;
    text-align: center;

    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
}

.password-box h2 {
    color: #ff4f81;
}

.password-box input {
    width: 100%;
    padding: 12px;

    border: 2px solid #ff9a9e;
    border-radius: 20px;

    text-align: center;
    font-size: 16px;
}

.password-box button {
    padding: 12px 20px;

    border: none;
    border-radius: 20px;

    background: #ff4f81;
    color: white;

    cursor: pointer;
    font-size: 15px;
}



.password-box .close-btn {
    margin-left: 5px;
    background: #aaa;
}


 h1 {
    color: #ff4f81;
    font-size: clamp(22px, 7vw, 30px);
    margin: 10px 0;
}

p {
    color: #555;
    font-size: clamp(14px, 4.5vw, 18px);
    line-height: 1.5;
    margin: 8px 0;
}

.gift {
    font-size: clamp(60px, 20vw, 100px);
    display: inline-block;
    cursor: pointer;
}

    .gift:hover {
        transform: scale(1.2);
    }

    @keyframes bounce {
        0%, 100% {
            transform: translateY(0);
        }

        50% {
            transform: translateY(-15px);
        }
    }

    .heart {
        position: fixed;
        font-size: 25px;
        animation: float 4s linear infinite;
    }

    @keyframes float {
        0% {
            bottom: -50px;
            opacity: 1;
        }

        100% {
            bottom: 100%;
            opacity: 0;
        }
    }

    /* Small mobile phones */
@media (max-height: 650px) {

    body {
        padding: 10px;
    }

    .card {
        padding: 18px 15px;
        border-radius: 25px;
    }

    .big-heart {
        font-size: 55px;
    }

    h1 {
        margin: 6px 0;
    }

    p {
        margin: 5px 0;
        font-size: 14px;
    }

    h2 {
        margin: 8px 0 0;
        font-size: 18px;
    }
}
</style>
</head>

<body>

<div class="card">

    <h1>🎉 Happy Birthday! 🎉</h1>

    <p>Someone has a special surprise for you... ❤️</p>

    <div class="gift" onclick="openPopup()">🎁</div>
        
    <p>👆 Click the gift</p>

</div>

<div id="popup">

    <div class="password-box">

        <h2>🎂 Birthday Surprise 🎁</h2>

        <p>Enter the secret password ❤️</p>

        <input 
            type="password" 
            id="password" 
            placeholder="Enter LOVE password"
            autofocus
        >

        <br><br>

        <button onclick="checkPassword()">
            Open Surprise 💕
        </button>


    </div>

</div>




<script>
    function createHeart() {

        const heart = document.createElement("div");

        heart.className = "heart";
        heart.innerHTML = "❤️";

        heart.style.left = Math.random() * 100 + "%";
        heart.style.animationDuration =
            (Math.random() * 3 + 3) + "s";

        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 5000);
    }

    setInterval(createHeart, 700);
    
    function openPopup() {
    document.getElementById("popup").style.display = "flex";

    document.getElementById("password").focus();
}


function checkPassword() {

    let password = document.getElementById("password").value;

    if (password === "1234") {

        window.location.href = "2nd step.html";

    } else {

        alert("❌ Wrong Password! Try again ❤️");

    }
}
    
</script>
</body>
</html>
